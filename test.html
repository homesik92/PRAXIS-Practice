<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test menu — PRAXIS-Practice</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <main>
    <p><a href="index.html">&larr; Choose a different test</a></p>
    <h1 id="test-name">Test menu</h1>
    <p id="status-note" class="status-note">Loading&hellip;</p>
  </main>
  <script type="module">
    import { loadTestList } from "./js/schema.js";

    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const heading = document.getElementById("test-name");
    const statusNote = document.getElementById("status-note");
    const main = document.querySelector("main");

    if (!code) {
      statusNote.textContent = "No test selected. Go back and choose one.";
    } else {
      const result = await loadTestList();
      const test = result.ok ? result.tests.find((t) => t.code === code) : undefined;
      if (!test) {
        statusNote.textContent = `Test "${code}" is not registered.`;
      } else {
        heading.textContent = test.name;
        statusNote.remove();
        const nav = document.createElement("nav");
        const a = document.createElement("a");
        a.href = `run.html?code=${encodeURIComponent(code)}&mode=test`;
        a.textContent = "Take a practice test";
        nav.appendChild(a);
        main.appendChild(nav);
      }
    }
  </script>
</body>
</html>
