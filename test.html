<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test menu — PRAXIS-Practice</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <main>
    <p><a href="index.html">&larr; Choose a different test</a></p>
    <h1 id="test-name">Test menu</h1>
    <p id="status-note" class="status-note">Loading&hellip;</p>
  </main>
  <script type="module">
    import { loadManifest, loadBank, assembleDueDrill, weakestCategory, flattenCategoryTree } from "./js/schema.js";
    import {
      STORAGE_KEY,
      loadStore,
      saveStore,
      findInProgressAttempt,
      findFirstAndLatestAttempts,
      exportStoreAsJson,
      importStoreFromJson,
      summarizeStore,
    } from "./js/store.js";
    import { percentOf } from "./js/results.js";

    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const heading = document.getElementById("test-name");
    const statusNote = document.getElementById("status-note");
    const main = document.querySelector("main");

    if (!code) {
      statusNote.textContent = "No test selected. Go back and choose one.";
    } else {
      // Loads the manifest entry and the full bank directly, rather than via
      // loadTestList (Phase 1) -- S2 needs the bank's question ids for the due
      // count below (Phase 4.3), and loadTestList's per-test summary shape doesn't
      // carry them or the manifest's `file` path needed to fetch them separately.
      // This also means S2 now fetches exactly one bank instead of every enabled
      // test's summary just to find this one.
      // includeDisabled: S2 is also the hub for resuming/reviewing/tracking progress
      // on a test, not just starting a new one -- that must keep working even if this
      // test has since been disabled for new attempts (Phase 6.5 finding).
      const manifestResult = await loadManifest(globalThis.fetch, "data/manifest.json", { includeDisabled: true });
      const manifestEntry = manifestResult.ok ? manifestResult.tests.find((t) => t.code === code) : undefined;
      const bankResult = manifestEntry ? await loadBank(manifestEntry.file) : undefined;
      if (!bankResult || !bankResult.ok) {
        statusNote.textContent = `Test "${code}" is not registered.`;
      } else {
        const bank = bankResult.bank;
        heading.textContent = bank.name;
        statusNote.remove();
        const nav = document.createElement("nav");

        // S2 leads with a "Resume attempt" entry when one exists (finding #10) --
        // run.html's own résumé lookup already handles the actual behavior identically
        // whichever link is clicked, so this is purely a discoverability fix. A load
        // failure here is skipped silently rather than surfaced: this is just an entry
        // point, and run.html already reports storage failures robustly for the
        // test-taking flow itself.
        const loadResult = loadStore();
        if (loadResult.ok) {
          // "View progress dashboard" (Phase 6.5) -- only once at least one
          // completed attempt exists, since the dashboard's comparison and
          // per-category sections have nothing to show before then.
          const { first } = findFirstAndLatestAttempts(loadResult.store, code);
          if (first) {
            const dashboardLink = document.createElement("a");
            dashboardLink.href = `dashboard.html?code=${encodeURIComponent(code)}`;
            dashboardLink.textContent = "View progress dashboard";
            nav.appendChild(dashboardLink);
          }

          const inProgress = findInProgressAttempt(loadResult.store, code);
          if (inProgress) {
            const p = document.createElement("p");
            p.textContent = `${inProgress.answers.length} of ${inProgress.formLength} questions answered.`;
            const resumeLink = document.createElement("a");
            resumeLink.href = `run.html?code=${encodeURIComponent(code)}&mode=test`;
            resumeLink.textContent = "Resume attempt";
            nav.appendChild(resumeLink);
            nav.appendChild(p);
          }

          // "N questions due" (Phase 4.3, SCHEMA.md S2, D-8).
          const dueCount = assembleDueDrill(bank, { history: loadResult.store.questionHistory }).questions.length;
          if (dueCount > 0) {
            const dueLink = document.createElement("a");
            dueLink.href = `run.html?code=${encodeURIComponent(code)}&mode=study&due=1`;
            dueLink.textContent = `${dueCount} question${dueCount === 1 ? "" : "s"} due for review`;
            nav.appendChild(dueLink);
          }

          // Weakest-category suggestion (Phase 4.4, SCHEMA.md S2, D-18) -- links
          // straight into S5's existing category-mode path (Phase 4.1), which
          // already accepts any valid category id and doesn't need to know this
          // one was picked by accuracy rather than by hand from the picker.
          const weakest = weakestCategory(bank, loadResult.store.questionHistory);
          if (weakest) {
            const categoryLabel =
              flattenCategoryTree(bank.categories).find((n) => n.id === weakest.categoryId)?.label ?? weakest.categoryId;
            const percent = percentOf(weakest.correct, weakest.seen);
            const weakestLink = document.createElement("a");
            weakestLink.href = `run.html?code=${encodeURIComponent(code)}&mode=study&category=${encodeURIComponent(weakest.categoryId)}`;
            weakestLink.textContent = `You're weakest in ${categoryLabel} (${percent}% correct) — practice it`;
            nav.appendChild(weakestLink);
          }
        }

        const a = document.createElement("a");
        a.href = `run.html?code=${encodeURIComponent(code)}&mode=test`;
        a.textContent = "Take a practice test";
        nav.appendChild(a);

        // No ?category= (Phase 4.1, SCHEMA.md S1.1 S2/S5) -- run.html's own picker
        // is where a category gets chosen; the weakest-category link above (Phase
        // 4.4) is the only *category*-pre-filtered entry point into S5 (the due
        // link above it, Phase 4.3, pre-filters by due=1 instead).
        const studyLink = document.createElement("a");
        studyLink.href = `run.html?code=${encodeURIComponent(code)}&mode=study`;
        studyLink.textContent = "Study a topic";
        nav.appendChild(studyLink);

        main.appendChild(nav);

        // "Download my progress" (Phase 6.2, SCHEMA.md finding #9) -- exports the
        // WHOLE store (every test's attempts + history), not just this one, even
        // though the button lives on this per-test page; there's no other screen
        // that's a more natural home for a single global export action.
        const exportStatus = document.createElement("p");
        exportStatus.className = "status-note";
        exportStatus.hidden = true;
        const exportButton = document.createElement("button");
        exportButton.type = "button";
        exportButton.textContent = "Download my progress";
        exportButton.addEventListener("click", () => {
          // Re-loads fresh rather than reusing the page-load `loadResult` closure --
          // another tab may have written since this page loaded, and an export that's
          // silently stale defeats the point of a backup/recovery mechanism.
          const freshLoadResult = loadStore();
          if (!freshLoadResult.ok) {
            exportStatus.textContent = "Your progress could not be loaded, so it can't be exported right now.";
            exportStatus.hidden = false;
            return;
          }
          exportStatus.hidden = true;
          const { filename, content } = exportStoreAsJson(freshLoadResult.store);
          const blob = new Blob([content], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          link.click();
          URL.revokeObjectURL(url);
        });
        main.appendChild(exportButton);
        main.appendChild(exportStatus);

        // "Upload progress" (Phase 6.7, SCHEMA.md finding #9's restore half) --
        // restores a previously-exported backup file, REPLACING whatever's currently
        // saved on this device after an explicit confirmation. Deliberately does NOT
        // attempt to merge with existing data (session owner's call, 2026-08-18):
        // merging progress from two devices is a separate, harder feature, not part
        // of this one.
        const importStatus = document.createElement("p");
        importStatus.className = "status-note";
        importStatus.hidden = true;

        const importLabel = document.createElement("label");
        importLabel.appendChild(document.createTextNode("Upload progress "));
        const importInput = document.createElement("input");
        importInput.type = "file";
        importInput.accept = "application/json,.json";
        importLabel.appendChild(importInput);

        const importDialog = document.createElement("dialog");
        importDialog.setAttribute("aria-labelledby", "import-confirm-heading");
        const importHeading = document.createElement("h2");
        importHeading.id = "import-confirm-heading";
        importHeading.textContent = "Replace your progress?";
        const importMessage = document.createElement("p");
        const importCancelButton = document.createElement("button");
        importCancelButton.type = "button";
        importCancelButton.textContent = "Cancel";
        const importConfirmButton = document.createElement("button");
        importConfirmButton.type = "button";
        importConfirmButton.textContent = "Replace progress";
        importDialog.append(importHeading, importMessage, importCancelButton, importConfirmButton);

        let pendingImportStore = null;
        // The exact raw localStorage value present when the dialog's summary was
        // last built -- compared byte-for-byte against a fresh read right before the
        // actual write (code review finding: the rendered summary TEXT alone isn't a
        // reliable staleness signal, since two genuinely different stores can
        // summarize to the identical count -- e.g. "1 attempt, 0 questions with
        // history" either way -- and text-equality would then wrongly treat a real
        // change as unchanged).
        let currentRawAtSummaryTime = null;

        // Maps importStoreFromJson's tagged failure reasons to a message a person
        // uploading the wrong (or a stale/future) file can actually act on, matching
        // this project's "storage failures are visible, never silent" convention
        // (Phase 6.1) rather than a single generic "import failed."
        const importErrorMessages = {
          unreadable: "That file doesn't look like a valid progress export. Nothing was changed.",
          "future-version":
            "That file was exported from a newer version of this app and can't be restored here. Nothing was changed.",
          "missing-migration":
            "That file is from an older version of this app that can no longer be read. Nothing was changed.",
          "migration-failed": "That file couldn't be converted to the current format. Nothing was changed.",
        };

        // Builds the "This will replace X with Y" message from fresh reads of both
        // stores every time it's called (code review finding: describes the incoming
        // file too, not just what's being replaced, and is called again right before
        // the actual write below rather than trusted from file-select time).
        function describeReplacement(incomingStore) {
          currentRawAtSummaryTime = localStorage.getItem(STORAGE_KEY);
          const currentLoadResult = loadStore();
          const current = currentLoadResult.ok ? summarizeStore(currentLoadResult.store) : null;
          const currentText = current
            ? `${current.attempts} attempt${current.attempts === 1 ? "" : "s"}, ${current.questionsWithHistory} question${current.questionsWithHistory === 1 ? "" : "s"} with history`
            : "your current progress";
          const incoming = summarizeStore(incomingStore);
          const incomingText = `${incoming.attempts} attempt${incoming.attempts === 1 ? "" : "s"}, ${incoming.questionsWithHistory} question${incoming.questionsWithHistory === 1 ? "" : "s"} with history`;
          return `This will permanently replace ${currentText} currently saved on this device with the uploaded file (${incomingText}). This can't be undone.`;
        }

        importInput.addEventListener("change", async () => {
          const file = importInput.files[0];
          if (!file) return;
          importStatus.hidden = true;
          // Re-entrancy guard (code review finding): the file input stays enabled
          // while this async handler is mid-flight, so without this a second `change`
          // before the first completes could call showModal() on an already-open
          // dialog (throws) and desync pendingImportStore from the displayed summary.
          importInput.disabled = true;

          try {
            const text = await file.text();
            const result = importStoreFromJson(text);
            if (!result.ok) {
              importStatus.textContent =
                importErrorMessages[result.reason] ?? "That file couldn't be imported. Nothing was changed.";
              importStatus.hidden = false;
              importInput.value = ""; // allow re-selecting the same (or a corrected) file
              return;
            }
            importMessage.textContent = describeReplacement(result.store);
            pendingImportStore = result.store;
            importDialog.showModal();
          } catch {
            // e.g. File.text() rejecting (an interrupted/inaccessible read) -- visible,
            // not silent, matching this project's storage-failure convention even
            // though this specific failure isn't storage (code review finding: this
            // handler previously had no try/catch at all).
            importStatus.textContent = "That file couldn't be read. Nothing was changed.";
            importStatus.hidden = false;
            importInput.value = "";
          } finally {
            importInput.disabled = false;
          }
        });

        importCancelButton.addEventListener("click", () => importDialog.close());
        // Fires on every close path (Cancel click, Esc) so the file input always
        // resets and focus always returns predictably, matching the confirm-submit
        // dialog's own close-event pattern in run.html (Phase 3.2) rather than
        // duplicating this per button.
        importDialog.addEventListener("close", () => {
          importInput.value = "";
          pendingImportStore = null;
          importInput.focus();
        });

        importConfirmButton.addEventListener("click", () => {
          // Checked right now, immediately before the actual write, rather than
          // trusting the summary computed when the dialog opened (code review
          // finding): the dialog can sit open indefinitely, and another tab may have
          // saved new progress in the meantime. Compares the exact raw stored value,
          // not the rendered summary text -- two genuinely different stores can
          // summarize to an identical count (e.g. "1 attempt, 0 questions with
          // history" either way), so a text comparison alone can miss a real change.
          // If the underlying data changed, show the updated warning and make the
          // person confirm again against accurate information instead of silently
          // destroying whatever's newly there.
          if (localStorage.getItem(STORAGE_KEY) !== currentRawAtSummaryTime) {
            importMessage.textContent = describeReplacement(pendingImportStore);
            return;
          }
          const saveResult = saveStore(pendingImportStore);
          importDialog.close();
          if (!saveResult.ok) {
            importStatus.textContent = "Your progress could not be saved, so the restore didn't complete.";
            importStatus.hidden = false;
            return;
          }
          location.reload();
        });

        main.appendChild(importLabel);
        main.appendChild(importDialog);
        main.appendChild(importStatus);
      }
    }
  </script>
</body>
</html>
