<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test runner — PRAXIS-Practice</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <main>
    <p><a id="back-link" href="index.html">&larr; Back</a></p>
    <h1 id="test-heading">Test runner</h1>
    <p id="status-note" class="status-note" hidden></p>

    <div id="start-screen" hidden>
      <p id="start-summary"></p>
      <button id="start-button" type="button">Start</button>
    </div>

    <div id="expired-screen" hidden>
      <h2>Time expired while you were away</h2>
      <p id="expired-summary"></p>
      <button id="expired-acknowledge-button" type="button">See your results</button>
    </div>

    <p id="timer" hidden></p>
    <p id="position" hidden></p>

    <div id="run-screen" hidden>
      <form id="question-form">
        <fieldset>
          <legend id="question-stem"></legend>
          <div id="options-list"></div>
        </fieldset>
      </form>
      <p>
        <label><input type="checkbox" id="flag-toggle" /> Flag this question for review</label>
      </p>
      <p id="editing-note" hidden>
        Reviewing this question -- changing the answer above updates it in your review list.
        <button id="back-to-review-button" type="button">Back to review</button>
      </p>
    </div>

    <div id="review-screen" hidden>
      <h2>Review your answers</h2>
      <p>Reopen any question below to change its answer or flag before submitting.</p>
      <ol id="review-list"></ol>
      <button id="submit-button" type="button">Submit test</button>
    </div>

    <dialog id="confirm-submit-dialog" aria-labelledby="confirm-submit-heading">
      <h2 id="confirm-submit-heading">Submit test?</h2>
      <p id="confirm-submit-message"></p>
      <button id="confirm-cancel-button" type="button">Cancel</button>
      <button id="confirm-submit-button" type="button">Submit test</button>
    </dialog>
  </main>
  <script type="module">
    import { loadBank, assembleForm, resumeForm } from "./js/schema.js";
    import { isCorrect, buildReviewRows, countReviewStatus } from "./js/runner.js";
    import { flattenCategoryLabels } from "./js/results.js";
    import { updateHistory } from "./js/srs.js";
    import {
      loadStore,
      saveStore,
      startAttempt,
      recordAnswer,
      updateAnswer,
      recordQuestionHistory,
      completeAttempt,
      findInProgressAttempt,
      findAttempt,
      handleStorageEvent,
    } from "./js/store.js";

    const params = new URLSearchParams(location.search);
    const code = params.get("code");
    const mode = params.get("mode");

    const backLink = document.getElementById("back-link");
    const heading = document.getElementById("test-heading");
    const statusNote = document.getElementById("status-note");
    const startScreen = document.getElementById("start-screen");
    const startSummary = document.getElementById("start-summary");
    const startButton = document.getElementById("start-button");
    const expiredScreen = document.getElementById("expired-screen");
    const expiredSummary = document.getElementById("expired-summary");
    const expiredAcknowledgeButton = document.getElementById("expired-acknowledge-button");
    const runScreen = document.getElementById("run-screen");
    const timerEl = document.getElementById("timer");
    const positionEl = document.getElementById("position");
    const stemEl = document.getElementById("question-stem");
    const optionsEl = document.getElementById("options-list");
    const flagToggle = document.getElementById("flag-toggle");
    const editingNote = document.getElementById("editing-note");
    const backToReviewButton = document.getElementById("back-to-review-button");
    const reviewScreen = document.getElementById("review-screen");
    const reviewList = document.getElementById("review-list");
    const submitButton = document.getElementById("submit-button");
    const confirmSubmitDialog = document.getElementById("confirm-submit-dialog");
    const confirmSubmitMessage = document.getElementById("confirm-submit-message");
    const confirmCancelButton = document.getElementById("confirm-cancel-button");
    const confirmSubmitButton = document.getElementById("confirm-submit-button");

    if (code) backLink.href = `test.html?code=${encodeURIComponent(code)}`;

    function showStatus(message) {
      statusNote.textContent = message;
      statusNote.hidden = false;
    }

    if (!code) {
      showStatus("No test selected. Go back and choose one.");
    } else if (mode !== "test") {
      // S5 (untimed topic study) is Phase 4.1 -- this runner only serves S3 for now.
      showStatus("Topic study isn't available yet.");
    } else {
      // Manifest lookup happens via a full bank fetch rather than loadTestList here,
      // since the runner needs the whole bank (questions included), not the summary
      // S1/S2 use -- see js/schema.js's loadBank vs loadBankSummary split.
      const manifestResponse = await fetch("data/manifest.json");
      const manifest = manifestResponse.ok ? await manifestResponse.json() : { tests: [] };
      const entry = (manifest.tests ?? []).find((t) => t.code === code && t.enabled);

      if (!entry) {
        showStatus(`Test "${code}" is not registered.`);
      } else {
        const result = await loadBank(entry.file);
        if (!result.ok) {
          showStatus("This test's questions could not be loaded. Try again later.");
        } else {
          runTest(result.bank);
        }
      }
    }

    function showUnresumableStatus() {
      showStatus("This in-progress attempt could not be resumed, because the test's questions have changed since it started.");
    }

    // Shared by both the normal in-run Submit path and the expired-screen's
    // acknowledgment (SCHEMA.md S3, finding #10): scoring an attempt and handing off
    // to S4 is the same operation regardless of which path reached it.
    function completeAndGoToResults(store, attemptId) {
      const completeResult = completeAttempt(store, attemptId);
      if (completeResult.ok) {
        // Best effort: every answer up to this point is already saved individually,
        // so a failure here only leaves the "completed" status unwritten, not any
        // data loss (see finish()'s original comment, now shared here).
        saveStore(completeResult.store);
      }
      location.href = `results.html?attempt=${encodeURIComponent(attemptId)}`;
    }

    function showExpiredScreen(store, attempt) {
      expiredScreen.hidden = false;
      expiredSummary.textContent =
        `This attempt's time limit passed while you were away. ${attempt.answers.length} of ` +
        `${attempt.formLength} questions were answered before time ran out.`;
      expiredAcknowledgeButton.addEventListener(
        "click",
        () => completeAndGoToResults(store, attempt.id),
        { once: true },
      );
    }

    function runTest(bank) {
      heading.textContent = bank.name;

      const loadResult = loadStore();
      if (!loadResult.ok) {
        showStatus("Your saved progress could not be loaded, so this test can't be started right now.");
        return;
      }
      const store = loadResult.store;

      const existingAttempt = findInProgressAttempt(store, bank.code);
      if (existingAttempt) {
        // Wall-clock deadline check (SCHEMA.md §2.8, finding #10) -- checked before
        // resumeForm, since the expired path never needs the reconstructed form at
        // all. If the deadline already passed while this tab was closed, it must not
        // be silently scored on load: show the expired screen first.
        const deadline = Date.parse(existingAttempt.startedAt) + bank.timeLimitMinutes * 60_000;
        if (Date.now() >= deadline) {
          showExpiredScreen(store, existingAttempt);
          return;
        }

        // Résumé (SCHEMA.md §2.8, D-19). Goes straight into the run screen -- no
        // Start confirmation step; S2's own "Resume attempt" entry (Phase 3.3) is
        // what surfaces this choice before landing here.
        const form = resumeForm(bank, existingAttempt.questionOrder);
        if (!form) {
          showUnresumableStatus();
          return;
        }
        beginRun(bank, form, store, existingAttempt, existingAttempt.answers.length);
        return;
      }

      // The real weight-correct draw (SCHEMA.md §2.7) -- replaces Phase 1's
      // placeholder of using bank.questions as given. Assembled once here, before the
      // Start screen is even shown, rather than inside the Start click handler: that
      // way the advertised count is always the number actually delivered (not
      // bank.formLength, which can exceed it when a category is short), and a bank
      // with nothing to draw never shows a dead-end Start button in the first place.
      // Real questionHistory (Phase 2.3) now feeds the least-recently-seen draw
      // preference (SCHEMA.md §2.7 step 3) -- always {} before this, since nothing
      // populated store.questionHistory yet.
      const form = assembleForm(bank, { history: store.questionHistory });
      if (form.questions.length === 0) {
        showStatus("This test has no questions yet.");
        return;
      }

      startSummary.textContent =
        `${form.questions.length} questions, ${bank.timeLimitMinutes} minutes. ` +
        "Once you answer a question you move straight to the next one -- answered questions can't be " +
        "revisited except through the review pass after the last question, where you can reopen and " +
        "change any answer before submitting.";
      startScreen.hidden = false;

      startButton.addEventListener(
        "click",
        () => {
          // Re-checks against a FRESH store load rather than reusing the
          // page-load-time `store` snapshot above (code review finding): the
          // `storage`-event listener that keeps things in sync isn't registered
          // until beginRun runs, so a tab that sat on this Start screen while
          // another tab (or another Start click) already created an attempt for
          // this test would otherwise overwrite it outright via saveStore's
          // unconditional whole-object write, with no "abandoned" marker -- silent
          // data loss, not just a missed abandon.
          const freshLoadResult = loadStore();
          if (!freshLoadResult.ok) {
            showStatus("Your progress could not be saved, so this test can't be started right now.");
            return;
          }
          const raceExisting = findInProgressAttempt(freshLoadResult.store, bank.code);
          if (raceExisting) {
            const resumedForm = resumeForm(bank, raceExisting.questionOrder);
            if (!resumedForm) {
              showUnresumableStatus();
              return;
            }
            beginRun(bank, resumedForm, freshLoadResult.store, raceExisting, raceExisting.answers.length);
            return;
          }

          const questionOrder = form.questions.map((q) => ({
            questionId: q.id,
            optionOrder: q.options.map((o) => o.id),
          }));
          const { store: startedStore, attempt } = startAttempt(freshLoadResult.store, {
            testCode: bank.code,
            mode: "test",
            timeLimitMinutes: bank.timeLimitMinutes,
            formLength: form.questions.length,
            categoryTargets: form.categoryTargets,
            shortfalls: form.shortfalls,
            questionOrder,
          });
          const saveResult = saveStore(startedStore);
          if (!saveResult.ok) {
            showStatus("Your progress could not be saved, so this test can't be started right now.");
            return;
          }
          beginRun(bank, form, startedStore, attempt, 0);
        },
        { once: true },
      );
    }

    function beginRun(bank, form, initialStore, attempt, startIndex) {
      startScreen.hidden = true;
      runScreen.hidden = false;
      timerEl.hidden = false;
      positionEl.hidden = false;

      let store = initialStore;
      let index = startIndex;
      let questionShownAt = Date.now();
      // Non-null while the run screen is showing a question reopened from the review
      // pass (SCHEMA.md §1.1 S3, D-11, finding #16) rather than the forward-only
      // answering flow -- switches the radio-group's change handler from
      // selectAnswer (append + advance) to commitEdit (update in place + return to
      // review), and the flag checkbox's change handler from doing nothing beyond its
      // own DOM state (buffered into the next selectAnswer call, SCHEMA.md §1.1 S3
      // finding #13) to persisting immediately via updateAnswer.
      let editingQuestionId = null;

      const categoryLabels = flattenCategoryLabels(bank.categories);

      // Wall-clock, derived from the attempt's own startedAt (SCHEMA.md's "timer is
      // wall-clock, not tick-counted") -- correct whether this is a fresh start or a
      // résumé, since startedAt is always the moment the attempt actually began.
      const deadline = Date.parse(attempt.startedAt) + bank.timeLimitMinutes * 60_000;
      const timerHandle = setInterval(updateTimer, 1000);
      updateTimer();

      function updateTimer() {
        const remainingMs = Math.max(0, deadline - Date.now());
        const totalSeconds = Math.floor(remainingMs / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        timerEl.textContent = `Time remaining: ${minutes}:${String(seconds).padStart(2, "0")}`;
        // The timer expiring while the tab stays open scores the attempt immediately
        // (SCHEMA.md S3, finding #10) -- no confirmation, unlike the Submit button's
        // dialog, since this is a forced deadline rather than a discretionary
        // choice. finish() clears this interval first, so this can't re-fire.
        if (remainingMs <= 0) finish();
      }

      function abortRun(message) {
        clearInterval(timerHandle);
        runScreen.hidden = true;
        reviewScreen.hidden = true;
        timerEl.hidden = true;
        positionEl.hidden = true;
        showStatus(message);
      }

      // Cross-tab reconciliation (SCHEMA.md §2.8 finding #2): if another tab writes
      // to the store while this one is mid-run, resync rather than silently
      // overwriting on this tab's next save. If the other tab completed or abandoned
      // this same attempt (e.g. it was started fresh there too), stop here rather
      // than let this tab keep answering into a superseded attempt.
      //
      // Only detects growth in `answers.length` -- a review-pass edit made in another
      // tab (which replaces an answer in place via updateAnswer, not appending) isn't
      // picked up here, so a simultaneous edit in another tab can silently clobber
      // this tab's edit. Narrow, same shape as issue #22's cross-tab SRS race; not
      // fixed here -- deferred as issue #28.
      //
      // Registered once per beginRun call and never removed -- safe today because
      // every current path reaches beginRun at most once per page load (the Start
      // button's `{ once: true }` handler, or résumé's direct call), and finish()
      // always navigates away via location.href, which discards every listener with
      // it. If a future change ever calls beginRun more than once without a full
      // navigation (e.g. a "switch test" affordance), this would need an explicit
      // removeEventListener paired with it to avoid stacking duplicate handlers.
      window.addEventListener("storage", (event) => {
        const result = handleStorageEvent(event);
        if (!result || !result.ok) return;
        store = result.store;
        const fresh = store.attempts.find((a) => a.id === attempt.id);
        if (!fresh || fresh.status !== "in-progress") {
          abortRun("This attempt was changed in another tab, so it can't continue here.");
          return;
        }
        if (fresh.answers.length > index) {
          index = fresh.answers.length;
          questionShownAt = Date.now();
          if (index < form.questions.length) renderQuestion();
          else showReviewScreen();
        }
      });

      // Only the editing-mode path needs a handler here: while freshly answering,
      // the checkbox's own `.checked` is read directly at select-time (below) --
      // nothing needs to buffer it separately.
      flagToggle.addEventListener("change", () => {
        if (!editingQuestionId) return;
        const result = updateAnswer(store, attempt.id, editingQuestionId, { flagged: flagToggle.checked });
        if (!result.ok) {
          abortRun("Your flag change could not be saved, so this attempt can't continue here.");
          return;
        }
        store = result.store;
        const saveResult = saveStore(store);
        if (!saveResult.ok) {
          abortRun(
            "Your flag change could not be saved, so this attempt can't continue here. " +
              "Reloading this page should let you resume from your last saved answer.",
          );
        }
      });

      backToReviewButton.addEventListener("click", () => showReviewScreen());

      function renderOptions(question, selectedOptionId, onChoose) {
        optionsEl.innerHTML = "";
        for (const option of question.options) {
          const label = document.createElement("label");
          label.style.display = "block";
          const input = document.createElement("input");
          input.type = "radio";
          input.name = "answer";
          input.value = option.id;
          if (option.id === selectedOptionId) input.checked = true;
          input.addEventListener("change", () => onChoose(option));
          label.appendChild(input);
          label.append(` ${option.content.value}`);
          optionsEl.appendChild(label);
        }
      }

      function renderQuestion() {
        editingQuestionId = null;
        editingNote.hidden = true;
        flagToggle.checked = false;

        const question = form.questions[index];
        positionEl.textContent = `Question ${index + 1} of ${form.questions.length}`;
        stemEl.textContent = question.stem.value;
        renderOptions(question, null, (option) => selectAnswer(question, option));
      }

      function selectAnswer(question, option) {
        const chosen = [option.id];
        // Captured before this question's questionHistory entry is updated below, so
        // a later review-pass edit (commitEdit) can recompute the SM-2 update fresh
        // from the same baseline this one started from, instead of stacking a second
        // review event on top of the first (N-6). `?? null` rather than leaving it
        // `undefined`: an explicit `null` here means "recorded, no prior entry
        // existed"; `undefined` is reserved to mean "this answer predates Phase 3.1
        // and was never given a baseline" (see commitEdit).
        const priorHistory = (store.questionHistory ?? {})[question.id] ?? null;
        const answer = {
          questionId: question.id,
          chosen,
          // Computed and stored per SCHEMA.md §2.8's documented shape, but not
          // trusted back: scoreAttempt always recomputes correctness itself from
          // `chosen` against the bank (self-verification principle). Stored for
          // other consumers (the review-pass list, S4) that want it without
          // re-deriving.
          correct: isCorrect(question, chosen),
          elapsedMs: Date.now() - questionShownAt,
          flagged: flagToggle.checked,
          priorHistory,
        };

        const recordResult = recordAnswer(store, attempt.id, answer);
        if (!recordResult.ok) {
          abortRun("This attempt could no longer be saved to, so it can't continue here.");
          return;
        }
        // recordAnswer's `recorded` flag is false on its idempotent no-op path (a
        // duplicate cross-tab write for this questionId) -- skip the SRS update in
        // that case so a duplicate write doesn't reschedule this question twice
        // (recordAnswer's own doc comment flags this exact hazard).
        let nextStore = recordResult.store;
        if (recordResult.recorded) {
          const historyEntry = updateHistory(priorHistory, answer.correct);
          nextStore = recordQuestionHistory(nextStore, question.id, historyEntry);
        }
        store = nextStore;
        const saveResult = saveStore(store);
        if (!saveResult.ok) {
          // Halt rather than continuing (code review finding: this used to fall
          // through to finish() on the last question, whose immediate navigation
          // meant the warning was never actually readable). The answer is safe in
          // memory but not on disk -- reloading resumes one question earlier, at
          // whatever was last actually persisted, rather than silently drifting
          // ahead of what's saved.
          abortRun(
            "Your last answer could not be saved, so this attempt can't continue here. " +
              "Reloading this page should let you resume from your last saved answer.",
          );
          return;
        }

        index += 1;
        if (index < form.questions.length) {
          questionShownAt = Date.now();
          renderQuestion();
        } else {
          showReviewScreen();
        }
      }

      function renderQuestionForEdit(question, answer) {
        editingQuestionId = question.id;
        editingNote.hidden = false;
        flagToggle.checked = Boolean(answer.flagged);

        const qIndex = form.questions.findIndex((q) => q.id === question.id);
        positionEl.textContent = `Reviewing question ${qIndex + 1} of ${form.questions.length}`;
        stemEl.textContent = question.stem.value;
        renderOptions(question, answer.chosen[0], (option) => commitEdit(question, option));
      }

      function commitEdit(question, option) {
        const chosen = [option.id];
        const correct = isCorrect(question, chosen);

        // Re-fetched from the current store rather than trusting a reference handed
        // in when this question was reopened (code review finding): the flag toggle
        // persists mid-edit via its own updateAnswer call below, so a reference
        // captured at reopen time can be stale by the time an answer is picked.
        const existingAnswer = findAttempt(store, attempt.id).answers.find((a) => a.questionId === question.id);

        const result = updateAnswer(store, attempt.id, question.id, { chosen, correct });
        if (!result.ok) {
          abortRun("Your changed answer could not be saved, so this attempt can't continue here.");
          return;
        }
        let nextStore = result.store;

        // Recompute the SM-2 update from the same fixed baseline this question
        // started this attempt from (N-6), so re-opening and changing an answer
        // multiple times always lands on the schedule the *final* answer deserves,
        // never stacking review events. `priorHistory === undefined` (as opposed to
        // the explicit `null` a Phase 3.1+ answer always carries) means this answer
        // predates that field -- skip the SRS correction rather than guess a wrong
        // baseline and silently misdate this question's schedule.
        if (existingAnswer.priorHistory !== undefined) {
          const historyEntry = updateHistory(existingAnswer.priorHistory, correct);
          nextStore = recordQuestionHistory(nextStore, question.id, historyEntry);
        }

        store = nextStore;
        const saveResult = saveStore(store);
        if (!saveResult.ok) {
          abortRun(
            "Your changed answer could not be saved, so this attempt can't continue here. " +
              "Reloading this page should let you resume from your last saved answer.",
          );
          return;
        }

        showReviewScreen();
      }

      function reopenQuestion(questionId) {
        const question = form.questions.find((q) => q.id === questionId);
        const answer = findAttempt(store, attempt.id).answers.find((a) => a.questionId === questionId);
        // Every row's Reopen button is wired the same way regardless of buildReviewRows'
        // answered flag, but a row can only be genuinely reopened for editing if it
        // has a recorded answer to prefill from. Not reachable via this project's
        // current forward-only flow (every question is answered before review), but
        // storage can be hand-edited -- degrade to a status message rather than
        // crash on a corrupted attempt (code review finding).
        if (!answer) {
          showStatus("This question has no recorded answer to reopen, so it can't be edited here.");
          return;
        }
        reviewScreen.hidden = true;
        runScreen.hidden = false;
        renderQuestionForEdit(question, answer);
      }

      function renderReviewList() {
        const currentAttempt = findAttempt(store, attempt.id);
        const rows = buildReviewRows(form.questions, currentAttempt.answers, categoryLabels);
        reviewList.innerHTML = "";
        for (const row of rows) {
          const li = document.createElement("li");
          const parts = [row.categoryLabel, "--", row.stemExcerpt];
          if (row.flagged) parts.push("(flagged)");
          if (!row.answered) parts.push("(not answered)");
          li.append(`${parts.join(" ")} `);
          const reopenButton = document.createElement("button");
          reopenButton.type = "button";
          reopenButton.textContent = "Reopen";
          reopenButton.addEventListener("click", () => reopenQuestion(row.questionId));
          li.appendChild(reopenButton);
          reviewList.appendChild(li);
        }
      }

      function showReviewScreen() {
        runScreen.hidden = true;
        reviewScreen.hidden = false;
        positionEl.textContent = `Review pass -- ${form.questions.length} questions`;
        renderReviewList();
      }

      submitButton.addEventListener("click", openConfirmSubmitDialog);

      function openConfirmSubmitDialog() {
        // Re-fetched fresh rather than reusing renderReviewList's, matching
        // reopenQuestion's pattern -- the confirm dialog's counts must reflect
        // whatever was last recorded, not a stale render (finding #11).
        const currentAttempt = findAttempt(store, attempt.id);
        const rows = buildReviewRows(form.questions, currentAttempt.answers, categoryLabels);
        const { unanswered, flagged } = countReviewStatus(rows);
        const unansweredText = unanswered === 1 ? "1 question unanswered" : `${unanswered} questions unanswered`;
        const flaggedText = flagged === 1 ? "1 question flagged for review" : `${flagged} questions flagged for review`;
        confirmSubmitMessage.textContent =
          `${unansweredText}, ${flaggedText}. Submitting will score your answers now.`;
        confirmSubmitDialog.showModal();
      }

      confirmCancelButton.addEventListener("click", () => confirmSubmitDialog.close());
      // Fires on every close path (Cancel click, Esc) so focus reliably returns to
      // the button that opened the dialog rather than relying on browser-specific
      // focus-restoration behavior.
      confirmSubmitDialog.addEventListener("close", () => submitButton.focus());

      confirmSubmitButton.addEventListener(
        "click",
        () => {
          confirmSubmitDialog.close();
          finish();
        },
        { once: true },
      );

      function finish() {
        clearInterval(timerHandle);
        // Self-healing on a failed save: reopening this test finds the attempt still
        // "in-progress" with every question already answered, which the startIndex
        // >= length check below routes straight into the review screen, whose Submit
        // button retries this.
        completeAndGoToResults(store, attempt.id);
      }

      // A résumed attempt that was fully answered but never successfully marked
      // "completed" lands back in the review pass rather than out-of-bounds on
      // form.questions[index] (code review finding, extended in Phase 3.1: the review
      // pass is now the universal gate between "last question answered" and
      // "scored," reached the same way whether that happened live or via résumé).
      if (index < form.questions.length) {
        renderQuestion();
      } else {
        showReviewScreen();
      }
    }
  </script>
</body>
</html>
