<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Results — PRAXIS-Practice</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <main>
    <p><a id="back-link" href="index.html">&larr; Back to tests</a></p>
    <h1>Results</h1>
    <p id="status-note" class="status-note" hidden></p>
    <div id="result" hidden>
      <p id="overall-score"></p>
      <p id="time-used"></p>
      <h2>By category</h2>
      <ul id="category-list"></ul>
      <div id="shortfall-note" hidden>
        <h2>This attempt isn't fully representative</h2>
        <ul id="shortfall-list"></ul>
      </div>
      <p id="full-review-unavailable-note" class="status-note" hidden>
        The full review list below couldn't be rebuilt, because this test's questions
        have changed since you took it. Your score above is still accurate.
      </p>
      <div id="full-review" hidden>
        <h2>Full review</h2>
        <ol id="full-review-list"></ol>
      </div>
    </div>
  </main>
  <script type="module">
    import { loadBank, resumeForm } from "./js/schema.js";
    import { scoreAttempt } from "./js/runner.js";
    import { summarizeAttempt, formatElapsed, buildFullReview, flattenCategoryLabels } from "./js/results.js";
    import { loadStore, findAttempt } from "./js/store.js";

    const params = new URLSearchParams(location.search);
    const attemptId = params.get("attempt");

    const statusNote = document.getElementById("status-note");
    const resultEl = document.getElementById("result");
    const overallEl = document.getElementById("overall-score");
    const timeUsedEl = document.getElementById("time-used");
    const categoryListEl = document.getElementById("category-list");
    const shortfallNoteEl = document.getElementById("shortfall-note");
    const shortfallListEl = document.getElementById("shortfall-list");
    const fullReviewUnavailableNoteEl = document.getElementById("full-review-unavailable-note");
    const fullReviewEl = document.getElementById("full-review");
    const fullReviewListEl = document.getElementById("full-review-list");
    const backLink = document.getElementById("back-link");

    // Text markers, not color alone (SCHEMA.md S1.3) -- the label text itself is
    // still what carries the meaning to a screen reader; the color applied to it in
    // renderReviewRow below is a sighted-user addition on top of that, not a
    // replacement (same pattern as the review pass's flag icon).
    function optionSuffix(option) {
      if (!option.isChosen) return option.isCorrectOption ? " (correct answer)" : "";
      return option.isCorrectOption ? " (your answer — correct)" : " (your answer — incorrect)";
    }

    function renderReviewRow(row) {
      const li = document.createElement("li");

      const categoryEl = document.createElement("p");
      const categoryStrong = document.createElement("strong");
      categoryStrong.textContent = row.categoryLabel;
      categoryEl.appendChild(categoryStrong);
      li.appendChild(categoryEl);

      const stemEl = document.createElement("p");
      stemEl.textContent = row.stem;
      li.appendChild(stemEl);

      const optionsEl = document.createElement("ul");
      for (const option of row.options) {
        const optionLi = document.createElement("li");
        optionLi.appendChild(document.createTextNode(option.text));
        const suffix = optionSuffix(option);
        if (suffix) {
          const suffixEl = document.createElement("span");
          // isCorrectOption alone decides the color (not the suffix string) --
          // both "(correct answer)" (unchosen) and "(your answer — correct)"
          // (chosen) are the same green; only a chosen-and-wrong option is red.
          suffixEl.className = option.isCorrectOption ? "option-suffix-correct" : "option-suffix-incorrect";
          suffixEl.textContent = suffix;
          optionLi.appendChild(suffixEl);
        }
        optionsEl.appendChild(optionLi);
      }
      li.appendChild(optionsEl);

      if (!row.answered) {
        const notAnsweredEl = document.createElement("p");
        notAnsweredEl.textContent = "You did not answer this question.";
        li.appendChild(notAnsweredEl);
      }

      if (row.explanation) {
        const explanationEl = document.createElement("p");
        explanationEl.textContent = `Explanation: ${row.explanation}`;
        li.appendChild(explanationEl);
      }

      return li;
    }

    function showStatus(message) {
      statusNote.textContent = message;
      statusNote.hidden = false;
    }

    if (!attemptId) {
      showStatus("No attempt specified.");
    } else {
      const loadResult = loadStore();
      if (!loadResult.ok) {
        showStatus("Your saved progress could not be loaded.");
      } else {
        // A reader who opens this link in a different browser profile, or whose
        // localStorage was cleared, legitimately finds nothing here -- the store is
        // this one browser's only copy (SCHEMA.md §2.8, no backup).
        const attempt = findAttempt(loadResult.store, attemptId);
        if (!attempt) {
          showStatus("No result found for this attempt. It may have been cleared from this browser.");
        } else if (attempt.status === "in-progress") {
          // Reachable via a stale link/bookmark/history entry to an attempt that
          // hasn't finished yet -- without this check, scoreAttempt would happily
          // score whatever's been answered so far and present a partial result
          // indistinguishably from a real final one (code review finding).
          backLink.href = `test.html?code=${encodeURIComponent(attempt.testCode)}`;
          showStatus("This attempt hasn't finished yet, so there's no result to show.");
        } else if (attempt.status === "abandoned") {
          backLink.href = `test.html?code=${encodeURIComponent(attempt.testCode)}`;
          showStatus("This attempt was abandoned before it finished, so there's no result to show.");
        } else {
          backLink.href = `test.html?code=${encodeURIComponent(attempt.testCode)}`;

          const manifestResponse = await fetch("data/manifest.json");
          const manifest = manifestResponse.ok ? await manifestResponse.json() : { tests: [] };
          const entry = (manifest.tests ?? []).find((t) => t.code === attempt.testCode && t.enabled);
          const bankResult = entry ? await loadBank(entry.file) : { ok: false };

          if (!bankResult.ok) {
            showStatus("This test's category information could not be loaded.");
          } else {
            // Recomputed from the stored answers every time, not trusted from a
            // cached value -- SCHEMA.md §2.7's "S4 self-verifies ... rather than
            // trusting [a] recorded [value] blindly" principle.
            const score = scoreAttempt(bankResult.bank, attempt.answers);
            const summary = summarizeAttempt(score, bankResult.bank, attempt.categoryTargets);
            overallEl.textContent = `${summary.overall.correct} / ${summary.overall.total} correct (${summary.overall.percent}%)`;
            timeUsedEl.textContent = `Time used: ${formatElapsed(attempt.startedAt, attempt.finishedAt)}`;
            for (const category of summary.categories) {
              const li = document.createElement("li");
              li.textContent = `${category.label}: ${category.correct}/${category.total} (${category.percent}%)`;
              categoryListEl.appendChild(li);
            }
            if (summary.shortfalls.length > 0) {
              // SCHEMA.md §1.2: an underfilled bank is disclosed, never silently
              // padded -- a score built from a non-representative draw and presented
              // as if representative is actively misleading.
              for (const shortfall of summary.shortfalls) {
                const li = document.createElement("li");
                li.textContent =
                  `${shortfall.label}: only ${shortfall.got} of ${shortfall.wanted} target questions were ` +
                  "available for this category, so this attempt underrepresents it.";
                shortfallListEl.appendChild(li);
              }
              shortfallNoteEl.hidden = false;
            }

            // resumeForm replays the exact original question/option order and
            // presentation this attempt drew (js/schema.js, D-19) -- the same
            // reconstruction run.html's own review pass and résumé path already rely
            // on, rather than re-deriving from the bank's current question order.
            const form = resumeForm(bankResult.bank, attempt.questionOrder);
            if (!form) {
              // The realistic trigger is a question/option physically removed from the
              // bank since this attempt was taken (retiring a question leaves it in
              // place -- SCHEMA.md §1.2 -- so this shouldn't happen from retirement
              // alone). Degrade gracefully: the score/category breakdown above is still
              // accurate, only the full review list can't be rebuilt.
              fullReviewUnavailableNoteEl.hidden = false;
            } else {
              const labels = flattenCategoryLabels(bankResult.bank.categories);
              const rows = buildFullReview(form, attempt.answers, labels);
              // One DOM mutation for the whole list, not one per row (code review
              // finding) -- the largest form runs to 150+ questions.
              const fragment = document.createDocumentFragment();
              for (const row of rows) {
                fragment.appendChild(renderReviewRow(row));
              }
              fullReviewListEl.appendChild(fragment);
              fullReviewEl.hidden = false;
            }

            resultEl.hidden = false;
          }
        }
      }
    }
  </script>
</body>
</html>
