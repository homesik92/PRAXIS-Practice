<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Results — PRAXIS-Practice</title>
  <link rel="stylesheet" href="css/base.css" />
</head>
<body>
  <main>
    <p><a id="back-link" href="index.html">&larr; Back to tests</a></p>
    <h1>Results</h1>
    <p id="status-note" class="status-note" hidden></p>
    <div id="result" hidden>
      <p id="overall-score"></p>
      <h2>By category</h2>
      <ul id="category-list"></ul>
    </div>
  </main>
  <script type="module">
    import { loadBank } from "./js/schema.js";
    import { scoreAttempt } from "./js/runner.js";
    import { summarizeAttempt } from "./js/results.js";
    import { loadStore, findAttempt } from "./js/store.js";

    const params = new URLSearchParams(location.search);
    const attemptId = params.get("attempt");

    const statusNote = document.getElementById("status-note");
    const resultEl = document.getElementById("result");
    const overallEl = document.getElementById("overall-score");
    const categoryListEl = document.getElementById("category-list");
    const backLink = document.getElementById("back-link");

    function showStatus(message) {
      statusNote.textContent = message;
      statusNote.hidden = false;
    }

    if (!attemptId) {
      showStatus("No attempt specified.");
    } else {
      const loadResult = loadStore();
      if (!loadResult.ok) {
        showStatus("Your saved progress could not be loaded.");
      } else {
        // A reader who opens this link in a different browser profile, or whose
        // localStorage was cleared, legitimately finds nothing here -- the store is
        // this one browser's only copy (SCHEMA.md §2.8, no backup).
        const attempt = findAttempt(loadResult.store, attemptId);
        if (!attempt) {
          showStatus("No result found for this attempt. It may have been cleared from this browser.");
        } else if (attempt.status === "in-progress") {
          // Reachable via a stale link/bookmark/history entry to an attempt that
          // hasn't finished yet -- without this check, scoreAttempt would happily
          // score whatever's been answered so far and present a partial result
          // indistinguishably from a real final one (code review finding).
          backLink.href = `test.html?code=${encodeURIComponent(attempt.testCode)}`;
          showStatus("This attempt hasn't finished yet, so there's no result to show.");
        } else if (attempt.status === "abandoned") {
          backLink.href = `test.html?code=${encodeURIComponent(attempt.testCode)}`;
          showStatus("This attempt was abandoned before it finished, so there's no result to show.");
        } else {
          backLink.href = `test.html?code=${encodeURIComponent(attempt.testCode)}`;

          const manifestResponse = await fetch("data/manifest.json");
          const manifest = manifestResponse.ok ? await manifestResponse.json() : { tests: [] };
          const entry = (manifest.tests ?? []).find((t) => t.code === attempt.testCode && t.enabled);
          const bankResult = entry ? await loadBank(entry.file) : { ok: false };

          if (!bankResult.ok) {
            showStatus("This test's category information could not be loaded.");
          } else {
            // Recomputed from the stored answers every time, not trusted from a
            // cached value -- SCHEMA.md §2.7's "S4 self-verifies ... rather than
            // trusting [a] recorded [value] blindly" principle.
            const score = scoreAttempt(bankResult.bank, attempt.answers);
            const summary = summarizeAttempt(score, bankResult.bank);
            overallEl.textContent = `${summary.overall.correct} / ${summary.overall.total} correct (${summary.overall.percent}%)`;
            for (const category of summary.categories) {
              const li = document.createElement("li");
              li.textContent = `${category.label}: ${category.correct}/${category.total} (${category.percent}%)`;
              categoryListEl.appendChild(li);
            }
            resultEl.hidden = false;
          }
        }
      }
    }
  </script>
</body>
</html>
